<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<style>
  :root {
    --bg: #fcfcfd;
    --side: #f3f4f6;
    --ink: #1b1f27;
    --dim: #7a8190;
    --line: #e3e5ea;
    --accent: #3b5bdb;
    --hover: #e8eaef;
    --code: #eef0f4;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --serif: Charter, "Iowan Old Style", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --side: #1b1e24;
      --ink: #dfe2e8;
      --dim: #7d8492;
      --line: #2a2e36;
      --accent: #8da2fb;
      --hover: #262a32;
      --code: #22262d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.4 var(--sans);
    display: grid; grid-template-rows: 44px 1fr; grid-template-columns: 250px 1fr;
    grid-template-areas: "side top" "side main";
  }
  button, input, textarea { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* top bar */
  #top {
    grid-area: top; display: flex; align-items: center; gap: 4px;
    padding: 0 12px; border-bottom: 1px solid var(--line);
  }
  #name {
    flex: 1; min-width: 0; border: 0; background: transparent;
    font-weight: 600; font-size: 15px; padding: 6px 8px; border-radius: 6px;
  }
  #name:hover { background: var(--hover); }
  #name:focus { background: var(--hover); outline: none; }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); opacity: 0; margin-right: 6px; transition: opacity .15s; }
  #dot.on { opacity: 1; }
  .btn {
    border: 0; background: transparent; padding: 6px 10px; border-radius: 6px;
    cursor: pointer; color: var(--dim); white-space: nowrap;
  }
  .btn:hover { background: var(--hover); color: var(--ink); }
  .btn.strong { color: var(--ink); }

  /* sidebar */
  #side {
    grid-area: side; background: var(--side); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  #sidehead {
    height: 44px; display: flex; align-items: center; padding: 0 8px 0 14px;
    border-bottom: 1px solid var(--line); gap: 2px;
  }
  #folder { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon { width: 28px; height: 28px; padding: 0; text-align: center; font-size: 16px; }
  #tree { flex: 1; overflow: auto; padding: 6px 6px 20px; }
  .row {
    display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 6px;
    cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: none;
  }
  .row:hover { background: var(--hover); }
  .row.active { background: var(--hover); color: var(--accent); font-weight: 600; }
  .caret { width: 10px; color: var(--dim); font-size: 10px; flex: none; transition: transform .12s; }
  .closed > .row .caret { transform: rotate(-90deg); }
  .closed > .kids { display: none; }
  .kids { margin-left: 12px; border-left: 1px solid var(--line); padding-left: 2px; }
  .file .row { color: var(--ink); }
  #hint { padding: 16px 14px; color: var(--dim); }
  #hint a { color: var(--accent); cursor: pointer; text-decoration: underline; }
  #modes { display: flex; gap: 2px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .mode { flex: 1; border: 0; background: transparent; padding: 4px 0; border-radius: 6px; color: var(--dim); cursor: pointer; }
  .mode:hover { color: var(--ink); }
  .mode.on { background: var(--hover); color: var(--ink); font-weight: 600; }
  .mode:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .count { color: var(--dim); font-size: 12px; flex: none; }

  /* main */
  #main { grid-area: main; min-height: 0; position: relative; }
  #ed {
    position: absolute; inset: 0; width: 100%; height: 100%; resize: none; border: 0; outline: 0;
    background: transparent; font: 14px/1.7 var(--mono);
    padding: 32px max(24px, calc((100% - 760px) / 2)); tab-size: 2;
  }
  #view {
    position: absolute; inset: 0; overflow: auto; display: none;
    padding: 32px max(24px, calc((100% - 720px) / 2)) 80px;
    font: 17px/1.7 var(--serif);
  }
  body.viewing #ed { display: none; }
  body.viewing #view { display: block; }
  #pdfv { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--bg); }
  body.pdf #ed, body.pdf #view { display: none; }
  body.pdf #pdfv { display: block; }
  body.pdf #save, body.pdf #toggle, body.pdf #dot { display: none; }
  body.pdf #name { cursor: default; }

  /* rendered markdown */
  #view h1, #view h2, #view h3, #view h4, #view h5, #view h6 { font-family: var(--sans); line-height: 1.25; margin: 1.6em 0 .5em; }
  #view h1 { font-size: 1.9em; margin-top: 0; }
  #view h2 { font-size: 1.45em; padding-bottom: .25em; border-bottom: 1px solid var(--line); }
  #view h3 { font-size: 1.15em; }
  #view p, #view ul, #view ol, #view pre, #view blockquote, #view table { margin: 0 0 1em; }
  #view a { color: var(--accent); }
  #view img { max-width: 100%; }
  #view code { font: .86em var(--mono); background: var(--code); padding: .15em .35em; border-radius: 4px; }
  #view pre { background: var(--code); padding: 14px 16px; border-radius: 8px; overflow: auto; }
  #view pre code { background: none; padding: 0; font-size: .82em; line-height: 1.55; }
  #view blockquote { margin-left: 0; padding-left: 16px; border-left: 3px solid var(--line); color: var(--dim); }
  #view hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
  #view table { border-collapse: collapse; font: 15px var(--sans); }
  #view th, #view td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; }
  #view th { background: var(--side); }
  #view li { margin: .2em 0; }
  #view li > ul, #view li > ol { margin: .2em 0; }
  #view input[type=checkbox] { margin-right: 6px; }

  @media (max-width: 700px) {
    body { grid-template-columns: 1fr; grid-template-rows: 44px 1fr; grid-template-areas: "top" "main"; }
    #side { position: fixed; z-index: 5; inset: 0 25% 0 0; transform: translateX(-100%); transition: transform .15s; }
    body.menu #side { transform: none; box-shadow: 0 0 40px #0006; }
    #menu { display: inline-block !important; }
  }
  #menu { display: none; }
</style>
</head>
<body>

<aside id="side">
  <div id="sidehead">
    <span id="folder">No folder</span>
    <button class="btn icon" id="new" title="New note" aria-label="New note">+</button>
    <button class="btn icon" id="refresh" title="Refresh" aria-label="Refresh folder">↻</button>
  </div>
  <div id="modes" role="tablist">
    <button class="mode on" data-mode="folders" role="tab">Folders</button>
    <button class="mode" data-mode="tags" role="tab">Tags</button>
  </div>
  <nav id="tree"><div id="hint">Load a folder to see its markdown and PDF files.</div></nav>
</aside>

<header id="top">
  <button class="btn icon" id="menu" aria-label="Files">☰</button>
  <span id="dot" title="Unsaved changes"></span>
  <input id="name" value="untitled.md" spellcheck="false" aria-label="File name">
  <button class="btn" id="load">Load folder</button>
  <button class="btn strong" id="save">Save</button>
  <button class="btn strong" id="toggle">View</button>
</header>

<main id="main">
  <textarea id="ed" spellcheck="true" placeholder="Start writing…"></textarea>
  <article id="view"></article>
  <iframe id="pdfv" title="PDF viewer"></iframe>
</main>

<script>
const $ = s => document.querySelector(s);
const ed = $('#ed'), nameEl = $('#name'), treeEl = $('#tree'), viewEl = $('#view');

let root = null;                                 // root directory handle
let cur = { handle: null, parent: null, name: 'untitled.md', path: '' };
let dirty = false;
const closed = new Set();                        // collapsed folder paths
const openTags = new Set();                      // expanded tag groups ('' = untagged)
const tagCache = new Map();                      // path -> { m: modified, s: size, tags }
let lastTree = null;
let mode = 'folders';
try { mode = localStorage.getItem('mdnotes-mode') === 'tags' ? 'tags' : 'folders'; } catch {}

/* ---------- tags: frontmatter `tags:` and inline #tags ---------- */
function extractTags(text) {
  const tags = new Set();
  const add = t => {
    t = t.trim().replace(/^["']|["']$/g, '').replace(/^#/, '').toLowerCase();
    if (t) tags.add(t);
  };
  let body = text;
  const fm = text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
  if (fm) {
    body = text.slice(fm[0].length);
    const y = fm[1];
    const m = y.match(/^tags?:[ \t]*(.*)$/mi);
    if (m) {
      const v = m[1].trim();
      if (v) v.replace(/^\[|\]$/g, '').split(',').forEach(add);
      else {
        const rest = y.slice(m.index + m[0].length).split(/\r?\n/).slice(1);
        for (const line of rest) {
          const li = line.match(/^\s*-\s*(.+)$/);
          if (li) add(li[1]); else if (line.trim()) break;
        }
      }
    }
  }
  body = body.replace(/```[\s\S]*?```/g, '').replace(/`[^`\n]*`/g, '');
  for (const m of body.matchAll(/(^|\s)#(\p{L}[\p{L}\p{N}_\/-]*)/gmu)) add(m[2]);
  return [...tags];
}

/* ---------- persistence of last folder ---------- */
const idb = () => new Promise((res, rej) => {
  const r = indexedDB.open('mdnotes', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function kvGet(k) {
  try { const d = await idb(); return await new Promise(res => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); }
  catch { return null; }
}
async function kvSet(k, v) {
  try { const d = await idb(); d.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch {}
}

/* ---------- folder handling ---------- */
async function scan(dir, path = '') {
  const node = { name: dir.name, path, dirs: [], files: [] };
  for await (const [name, h] of dir.entries()) {
    if (name.startsWith('.') || name === 'node_modules') continue;
    if (h.kind === 'directory') {
      const child = await scan(h, path + '/' + name);
      if (child.dirs.length || child.files.length) node.dirs.push(child);
    } else if (/\.(md|markdown|pdf)$/i.test(name)) {
      const fpath = path + '/' + name;
      const isPdf = /\.pdf$/i.test(name);
      let tags = [];
      if (!isPdf) try {
        const file = await h.getFile();
        let c = tagCache.get(fpath);
        if (!c || c.m !== file.lastModified || c.s !== file.size) {
          c = { m: file.lastModified, s: file.size, tags: extractTags(await file.text()) };
          tagCache.set(fpath, c);
        }
        tags = c.tags;
      } catch {}
      node.files.push({ name, handle: h, parent: dir, path: fpath, tags, type: isPdf ? 'pdf' : 'md' });
    }
  }
  const by = (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
  node.dirs.sort(by); node.files.sort(by);
  return node;
}

function renderTree(node, into) {
  for (const d of node.dirs) {
    const wrap = document.createElement('div');
    if (closed.has(d.path)) wrap.className = 'closed';
    const row = document.createElement('div');
    row.className = 'row'; row.tabIndex = 0; row.title = d.name;
    row.innerHTML = '<span class="caret">▼</span>';
    row.append(d.name);
    const toggle = () => { wrap.classList.toggle('closed'); wrap.classList.contains('closed') ? closed.add(d.path) : closed.delete(d.path); };
    row.onclick = toggle;
    row.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };
    const kids = document.createElement('div'); kids.className = 'kids';
    renderTree(d, kids);
    wrap.append(row, kids); into.append(wrap);
  }
  for (const f of node.files) into.append(fileRow(f));
}

function fileRow(f) {
  const wrap = document.createElement('div'); wrap.className = 'file';
  const row = document.createElement('div');
  row.className = 'row' + (f.path === cur.path && cur.handle ? ' active' : '');
  row.tabIndex = 0; row.title = f.path.slice(1);
  if (f.type === 'pdf') {
    row.innerHTML = '<span class="label"></span><span class="count">pdf</span>';
    row.querySelector('.label').textContent = f.name.replace(/\.pdf$/i, '');
  } else {
    row.textContent = f.name.replace(/\.(md|markdown)$/i, '');
  }
  row.onclick = () => openFile(f);
  row.onkeydown = e => { if (e.key === 'Enter') openFile(f); };
  wrap.append(row);
  return wrap;
}

function flatFiles(n) { return n.files.concat(...n.dirs.map(flatFiles)); }

function renderTags(tree, into) {
  const groups = new Map(), untagged = [];
  for (const f of flatFiles(tree)) {
    if (!f.tags.length) untagged.push(f);
    else for (const t of f.tags) { if (!groups.has(t)) groups.set(t, []); groups.get(t).push(f); }
  }
  const byName = (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
  const addGroup = (key, label, list) => {
    list.sort(byName);
    const wrap = document.createElement('div');
    if (!openTags.has(key)) wrap.className = 'closed';
    const row = document.createElement('div');
    row.className = 'row'; row.tabIndex = 0; row.title = label;
    row.innerHTML = '<span class="caret">▼</span><span class="label"></span><span class="count"></span>';
    row.querySelector('.label').textContent = key === '' ? label : '#' + label;
    row.querySelector('.count').textContent = list.length;
    const toggle = () => {
      wrap.classList.toggle('closed');
      wrap.classList.contains('closed') ? openTags.delete(key) : openTags.add(key);
    };
    row.onclick = toggle;
    row.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };
    const kids = document.createElement('div'); kids.className = 'kids';
    for (const f of list) kids.append(fileRow(f));
    wrap.append(row, kids); into.append(wrap);
  };
  [...groups.keys()].sort((a, b) => a.localeCompare(b)).forEach(t => addGroup(t, t, groups.get(t)));
  if (untagged.length) addGroup('', 'untagged', untagged);
  if (!groups.size) {
    const h = document.createElement('div'); h.id = 'hint';
    h.textContent = 'No tags yet. Write #tag anywhere in a note, or add tags: [a, b] at the top.';
    into.prepend(h);
  }
}

function updateModes() {
  document.querySelectorAll('.mode').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
}
function setMode(m) {
  mode = m;
  try { localStorage.setItem('mdnotes-mode', m); } catch {}
  updateModes(); renderSide();
}
function renderSide() {
  if (!lastTree) return;
  treeEl.innerHTML = '';
  if (!lastTree.dirs.length && !lastTree.files.length) {
    treeEl.innerHTML = '<div id="hint">No markdown or PDF files here yet. Press + to create one.</div>';
    return;
  }
  mode === 'tags' ? renderTags(lastTree, treeEl) : renderTree(lastTree, treeEl);
}

async function refresh() {
  if (!root) return;
  lastTree = await scan(root);
  renderSide();
}

async function setRoot(handle) {
  root = handle;
  tagCache.clear(); openTags.clear(); closed.clear();
  $('#folder').textContent = handle.name;
  kvSet('root', handle);
  await refresh();
}

async function loadFolder() {
  if (!window.showDirectoryPicker) {
    treeEl.innerHTML = '<div id="hint">This browser can\'t open folders. Use Chrome, Edge, Brave or Opera.</div>';
    return;
  }
  if (!(await confirmDiscard())) return;
  try {
    const h = await showDirectoryPicker({ mode: 'readwrite', id: 'md-notes' });
    newNote(true);
    await setRoot(h);
  } catch (e) { if (e.name !== 'AbortError') alert('Could not open folder: ' + e.message); }
}

/* ---------- file operations ---------- */
function setDirty(v) {
  dirty = v;
  $('#dot').classList.toggle('on', v);
  document.title = (v ? '• ' : '') + (nameEl.value || 'Notes');
}
async function confirmDiscard() {
  return !dirty || confirm('You have unsaved changes. Discard them?');
}
async function openFile(f) {
  if (f.path === cur.path && cur.handle) { closeMenu(); return; }
  if (!(await confirmDiscard())) return;
  if (f.type === 'pdf') {
    try { showPdf(await f.handle.getFile()); }
    catch (e) { alert('Could not open PDF: ' + e.message); return; }
    cur = { handle: f.handle, parent: f.parent, name: f.name, path: f.path, type: 'pdf' };
    (f.tags && f.tags.length ? f.tags : ['']).forEach(t => openTags.add(t));
    nameEl.value = f.name;
    setDirty(false);
    await refresh();
    closeMenu();
    return;
  }
  try {
    const file = await f.handle.getFile();
    ed.value = await file.text();
  } catch (e) { alert('Could not read file: ' + e.message); return; }
  leavePdf();
  cur = { handle: f.handle, parent: f.parent, name: f.name, path: f.path };
  (f.tags && f.tags.length ? f.tags : ['']).forEach(t => openTags.add(t));
  nameEl.value = f.name;
  setDirty(false);
  if (document.body.classList.contains('viewing')) renderView();
  await refresh();
  closeMenu();
}

/* ---------- pdf viewer (read-only, uses the browser's built-in viewer) ---------- */
const pdfEl = $('#pdfv');
let pdfUrl = null;
function showPdf(file) {
  setView(false);
  if (pdfUrl) URL.revokeObjectURL(pdfUrl);
  pdfUrl = URL.createObjectURL(new Blob([file], { type: 'application/pdf' }));
  pdfEl.src = pdfUrl;
  document.body.classList.add('pdf');
  nameEl.readOnly = true;
}
function leavePdf() {
  if (!document.body.classList.contains('pdf')) return;
  document.body.classList.remove('pdf');
  pdfEl.src = 'about:blank';
  if (pdfUrl) { URL.revokeObjectURL(pdfUrl); pdfUrl = null; }
  nameEl.readOnly = false;
}
function newNote(silent) {
  leavePdf();
  cur = { handle: null, parent: null, name: '', path: '' };
  ed.value = ''; nameEl.value = 'untitled.md';
  setDirty(false); setView(false);
  if (!silent) { nameEl.select(); }
  refresh();
}
async function write(handle, text) {
  const w = await handle.createWritable();
  await w.write(text); await w.close();
}
async function save() {
  if (cur.type === 'pdf') return;
  if (!root) { alert('Load a folder first — notes are saved into it.'); return; }
  let name = nameEl.value.trim().replace(/[\\/:*?"<>|]/g, '-') || 'untitled.md';
  if (!/\.(md|markdown)$/i.test(name)) name += '.md';
  nameEl.value = name;
  const parent = cur.parent || root;
  const dirPath = cur.path ? cur.path.slice(0, cur.path.lastIndexOf('/')) : '';
  try {
    if (cur.handle && name === cur.name) {
      await write(cur.handle, ed.value);
    } else {
      let exists = true;
      try { await parent.getFileHandle(name); } catch { exists = false; }
      if (exists && !confirm(`"${name}" already exists. Overwrite it?`)) return;
      const h = await parent.getFileHandle(name, { create: true });
      await write(h, ed.value);
      if (cur.handle) await parent.removeEntry(cur.name);   // rename
      cur = { handle: h, parent, name, path: dirPath + '/' + name };
    }
  } catch (e) { alert('Could not save: ' + e.message); return; }
  setDirty(false);
  flash('Saved');
  refresh();
}
function flash(msg) {
  const b = $('#save'), old = 'Save';
  b.textContent = msg + ' ✓';
  clearTimeout(flash.t);
  flash.t = setTimeout(() => b.textContent = old, 1100);
}

/* ---------- view / edit ---------- */
function setView(on) {
  document.body.classList.toggle('viewing', on);
  $('#toggle').textContent = on ? 'Edit' : 'View';
  if (on) renderView(); else ed.focus();
}
function renderView() { viewEl.innerHTML = md(ed.value); viewEl.scrollTop = 0; }

/* ---------- tiny markdown renderer ---------- */
function md(src) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const url = u => /^\s*(javascript|data|vbscript):/i.test(u) ? '#' : u;
  const inline = s => {
    const codes = [];
    s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    s = esc(s);
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, a, u) => `<img alt="${a}" src="${url(u)}">`);
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => `<a href="${url(u)}" target="_blank" rel="noopener">${t}</a>`);
    s = s.replace(/\*\*(.+?)\*\*|__(.+?)__/g, (m, a, b) => `<strong>${a || b}</strong>`);
    s = s.replace(/\*(?!\s)(.+?)\*|(?<!\w)_(?!\s)(.+?)_(?!\w)/g, (m, a, b) => `<em>${a || b}</em>`);
    s = s.replace(/~~(.+?)~~/g, '<del>$1</del>');
    return s.replace(/\u0000(\d+)\u0000/g, (m, n) => '<code>' + esc(codes[n]) + '</code>');
  };

  const lines = src.replace(/\r\n?/g, '\n').split('\n');
  const listRe = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  const hrRe = /^\s*([-*_])(\s*\1){2,}\s*$/;
  const tableSep = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
  const isStart = l => /^(#{1,6})\s/.test(l) || /^```/.test(l) || /^\s*>/.test(l) || hrRe.test(l) || listRe.test(l);

  const buildList = (items, idx, base) => {
    const tag = items[idx].ordered ? 'ol' : 'ul';
    let html = `<${tag}>`;
    while (idx < items.length && items[idx].indent >= base) {
      if (items[idx].indent > base) {
        const [h, n] = buildList(items, idx, items[idx].indent);
        html = html.endsWith('</li>') ? html.slice(0, -5) + h + '</li>' : html + h;
        idx = n; continue;
      }
      let t = items[idx].text, box = '';
      const m = t.match(/^\[([ xX])\]\s+(.*)$/);
      if (m) { box = `<input type="checkbox" disabled${m[1] !== ' ' ? ' checked' : ''}>`; t = m[2]; }
      html += `<li>${box}${inline(t)}</li>`; idx++;
    }
    return [html + `</${tag}>`, idx];
  };

  const out = [];
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }

    if (/^```/.test(l)) {                                   // fenced code
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`); continue;
    }
    let m = l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);          // heading
    if (m) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
    if (hrRe.test(l)) { out.push('<hr>'); i++; continue; }  // rule
    if (/^\s*>/.test(l)) {                                  // quote
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
      out.push(`<blockquote>${md(buf.join('\n'))}</blockquote>`); continue;
    }
    if (listRe.test(l)) {                                   // list
      const items = [];
      while (i < lines.length && lines[i].trim() && !hrRe.test(lines[i])) {
        const lm = lines[i].match(listRe);
        if (lm) items.push({ indent: lm[1].replace(/\t/g, '  ').length, ordered: /\d/.test(lm[2]), text: lm[3] });
        else if (items.length && /^\s+\S/.test(lines[i])) items[items.length - 1].text += ' ' + lines[i].trim();
        else break;
        i++;
      }
      out.push(buildList(items, 0, items[0].indent)[0]); continue;
    }
    if (l.includes('|') && i + 1 < lines.length && tableSep.test(lines[i + 1])) {   // table
      const cells = r => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
      const head = cells(l); i += 2;
      let html = '<table><thead><tr>' + head.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>';
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) {
        html += '<tr>' + cells(lines[i++]).map(c => `<td>${inline(c)}</td>`).join('') + '</tr>';
      }
      out.push(html + '</tbody></table>'); continue;
    }
    const buf = [];                                         // paragraph
    while (i < lines.length && lines[i].trim() && (!buf.length || !isStart(lines[i]))) buf.push(lines[i++].trim());
    out.push(`<p>${inline(buf.join(' '))}</p>`);
  }
  return out.join('\n');
}

/* ---------- wiring ---------- */
function closeMenu() { document.body.classList.remove('menu'); }
$('#menu').onclick = () => document.body.classList.toggle('menu');
$('#load').onclick = loadFolder;
$('#save').onclick = save;
$('#toggle').onclick = () => { if (cur.type !== 'pdf') setView(!document.body.classList.contains('viewing')); };
$('#new').onclick = async () => { if (await confirmDiscard()) { newNote(); closeMenu(); } };
$('#refresh').onclick = refresh;
document.querySelectorAll('.mode').forEach(b => b.onclick = () => setMode(b.dataset.mode));
updateModes();
ed.oninput = () => setDirty(true);
nameEl.oninput = () => setDirty(true);
nameEl.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); ed.focus(); } };

ed.addEventListener('keydown', e => {                       // Tab inserts two spaces
  if (e.key === 'Tab' && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
    document.execCommand('insertText', false, '  ');
  }
});
addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'e') { e.preventDefault(); $('#toggle').click(); }
});
addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- startup: offer to reopen the last folder ---------- */
(async () => {
  if (!window.showDirectoryPicker) {
    treeEl.innerHTML = '<div id="hint">This browser can\'t open folders. Use Chrome, Edge, Brave or Opera.</div>';
    return;
  }
  const h = await kvGet('root');
  if (!h) return;
  try {
    if ((await h.queryPermission({ mode: 'readwrite' })) === 'granted') { await setRoot(h); return; }
  } catch { return; }
  treeEl.innerHTML = '';
  const hint = document.createElement('div'); hint.id = 'hint';
  const a = document.createElement('a'); a.textContent = 'Reopen “' + h.name + '”';
  a.onclick = async () => {
    try { if ((await h.requestPermission({ mode: 'readwrite' })) === 'granted') await setRoot(h); } catch {}
  };
  hint.append(a, document.createTextNode(' or load another folder.'));
  treeEl.append(hint);
})();
</script>
